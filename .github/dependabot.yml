version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    reviewers:
      - merlinf14b
    labels:
      - dependencies
    groups:
      tanstack:
        patterns:
          - "@tanstack/*"
        update-types:
          - minor
          - patch
      storybook:
        patterns:
          - "storybook"
          - "@storybook/*"
          - "eslint-plugin-storybook"
        update-types:
          - minor
          - patch
      testing:
        patterns:
          - "@playwright/*"
          - "@testing-library/*"
          - "vitest"
          - "@vitest/*"
          - "jsdom"
        update-types:
          - minor
          - patch
      lint-format:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "prettier"
          - "globals"
          - "typescript-eslint"
        update-types:
          - minor
          - patch
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    labels:
      - ci
